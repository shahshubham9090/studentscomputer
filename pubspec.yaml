name: studentscomputer
description: "QuizMaster - A production-ready Quiz App built with Flutter."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  uuid: ^4.5.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^16.0.4
  shared_preferences: ^2.5.3
  google_mobile_ads: ^5.1.0
  file_picker: ^8.1.5
  csv: ^6.0.0
  excel: ^4.0.3
  flutter_animate: ^4.5.0
  fl_chart: 0.69.2
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  salomon_bottom_bar: ^3.3.2
  avatar_glow: ^3.0.1
  flutter_card_swiper: ^4.0.0
  animated_bottom_navigation_bar: ^1.3.3
  awesome_snackbar_content: ^0.1.6
  loading_animation_widget: ^1.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_logo.jpg"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.jpg
